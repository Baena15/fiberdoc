services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: fiberdoc
      POSTGRES_USER: fiberdoc
      POSTGRES_PASSWORD: fiberdoc
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fiberdoc -d fiberdoc"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # En Docker se usa PostgreSQL del servicio db (ver settings.py)
      DATABASE_URL: postgres://fiberdoc:fiberdoc@db:5432/fiberdoc
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
